name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing (OIDC) and provenance; no NPM_TOKEN secret is stored.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Repeats ci.yml's checks: that workflow runs in parallel and cannot stop a publish.
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Opens a "Version packages" PR while changesets are pending; publishes when that PR is merged.
      # v2 reads published versions from CHANGESETS_OUTPUT; v1 parses `New tag:` log lines, which
      # @changesets/cli 3 no longer prints, so it pushed no tags and created no GitHub releases.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
